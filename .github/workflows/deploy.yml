# Deploys the MoonBit blog (moonbit/examples/blog) to Cloudflare Workers as
# `blog`. Run by hand only (Actions tab, or the GitHub mobile app); pushes
# and pull requests never deploy. The secrets live in the `production`
# environment, which should allow only main, so other branches cannot use
# them. See moonbit/README.md, "Deploying".
name: deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: moonbit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install moon
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: make test
      # wrangler's build command runs make build (embed, moon, wasm-opt).
      - run: make deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
